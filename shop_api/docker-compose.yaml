services:
  web:
    build:
      context: .
    command: sh /app/entrypoint.sh
    container_name: 'web'
    expose:
      - "8000"
    env_file:
      .env
    volumes:
      - .:/app
      - back_media:/app/media
      - back_static:/app/static
    depends_on:
      - db
      - redis

  db:
    image: postgres:14
    container_name: 'postgres_shop'
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    container_name: 'redis_shop'
    image: redis:7
    volumes:
      - redis-data:/data

  celery_worker:
    build:
      context: .
    command: celery -A shop_api worker -l INFO -P solo
    depends_on:
      - redis
    env_file:
      .env
    volumes:
      - .:/app

  celery_beat:
    build:
      context: .
    command: celery -A shop_api beat --loglevel=info
    depends_on:
      - redis
    env_file:
      .env
    volumes:
      - .:/app

  celery_flower:
    build:
      context: .
    command: celery -A shop_api flower --port=5555
    ports:
      - "5556:5555"
    depends_on:
      - redis
    env_file:
      .env
    volumes:
      - .:/app

  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - back_media:/app/media
      - back_static:/app/static

volumes:
  db-data:
  redis-data:
  back_media:
  back_static: